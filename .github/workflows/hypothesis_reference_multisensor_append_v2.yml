name: Append Hypothesis Multi-Sensor Design V2
on:
  push:
    branches:
      - m4-d6-orchestration-redesign
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append broader hypothesis design once
        env:
          APPEND_B64: " …12632 chars truncated…" 
        run: |
          python -c "import os,base64; from pathlib import Path; p=Path('docs/M4_HYPOTHESIS_BOX_REFERENCE_2026-09-10.md'); t=p.read_text(encoding='utf-8'); m='# 18. Preferred multi-sensor Hypothesis Box design'; a=base64.b64decode(os.environ['APPEND_B64']).decode('utf-8'); p.write_text(t if m in t else t+a, encoding='utf-8')"
      - name: Commit reference update
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add docs/M4_HYPOTHESIS_BOX_REFERENCE_2026-09-10.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: expand hypothesis box multi-sensor design"
          git push origin HEAD:m4-d6-orchestration-redesign
