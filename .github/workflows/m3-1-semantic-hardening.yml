name: M3.1.1 Semantic Hardening Shadow Gate
on:
  workflow_dispatch:
  push:
    branches: [m3-1-semantic-hardening-audit]
    paths:
      - apps/api/app/behavior/decision_spine/**
      - apps/api/tests/decision_spine/**
      - apps/api/tests/conftest.py
      - docs/M3_1_*.md
      - .github/workflows/m3-1-semantic-hardening.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Verify exact checkout identity
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Setup Python
        uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install API dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r apps/api/requirements.txt
      - name: Compile shadow semantic-hardening modules
        run: |
          python -m py_compile apps/api/app/behavior/decision_spine/market_primitive_kernel_v2.py apps/api/app/behavior/decision_spine/canonical_candle_morphology_v2.py apps/api/app/behavior/decision_spine/canonical_chart_state_v2.py apps/api/app/behavior/decision_spine/canonical_market_structure_v2.py apps/api/app/behavior/decision_spine/canonical_level_graph_v2.py apps/api/app/behavior/decision_spine/canonical_indicator_contracts_v2.py apps/api/app/behavior/decision_spine/evidence_graph.py apps/api/app/behavior/decision_spine/canonical_evidence_graph_v2.py
      - name: M3.1.1 primitive-kernel tests
        working-directory: apps/api
        run: pytest -q tests/decision_spine/test_market_primitive_kernel_v2.py
      - name: M3.1.1 canonical-morphology tests
        working-directory: apps/api
        run: pytest -q tests/decision_spine/test_canonical_candle_morphology_v2.py
      - name: M3.1.1 canonical-chart-state tests
        working-directory: apps/api
        run: pytest -q tests/decision_spine/test_canonical_chart_state_v2.py
      - name: M3.1.1 canonical-market-structure tests
        working-directory: apps/api
        run: pytest -q tests/decision_spine/test_canonical_market_structure_v2.py
      - name: M3.1.1 canonical-level-graph tests
        working-directory: apps/api
        run: pytest -q tests/decision_spine/test_canonical_level_graph_v2.py
      - name: M3.1.1 canonical-indicator-contract tests
        working-directory: apps/api
        run: pytest -q tests/decision_spine/test_canonical_indicator_contracts_v2.py
      - name: M3.1.1 evidence-graph foundation tests
        working-directory: apps/api
        run: pytest -q tests/decision_spine/test_evidence_graph.py
      - name: M3.1.1 full canonical-evidence-graph tests
        working-directory: apps/api
        run: pytest -q tests/decision_spine/test_canonical_evidence_graph_v2.py
      - name: Locked M3.1 regression
        working-directory: apps/api
        run: pytest -q tests/decision_spine/test_snapshot_feature_kernel.py tests/decision_spine/test_m3_1_candle_pipeline.py tests/decision_spine/test_m3_1_levels.py tests/decision_spine/test_m3_1_indicator_pipeline.py tests/decision_spine/test_m3_1_mtf_pipeline.py tests/decision_spine/test_m3_1_price_evidence.py tests/decision_spine/test_m3_1_replay.py tests/decision_spine/test_m3_1_adversarial.py
      - name: Locked M3.2-A context contract regression
        working-directory: apps/api
        run: pytest -q tests/decision_spine/test_m3_2_context_contract.py
      - name: DecisionContext and Stage2 regression
        working-directory: apps/api
        run: pytest -q tests/decision_spine/test_decision_context.py tests/decision_spine/test_paper_guidance_decision_context_adapter.py tests/decision_spine/test_paper_guidance_m2_context_integration.py tests/decision_spine/test_stage2_integrity.py
      - name: Paper Guidance v1.88 regression
        working-directory: apps/api
        run: pytest -q tests/test_paper_guidance_v188.py
      - name: Historical API regression
        working-directory: apps/api
        run: pytest -q tests/test_api.py
      - name: Full API test tree with order-isolation regression
        working-directory: apps/api
        run: python -m pytest tests -q
      - name: Verify Decision Spine safety and authority invariants
        working-directory: apps/api
        run: |
          python - <<'PY'
          from app.behavior.decision_spine import FINAL_BAND_AUTHORITY, all_engine_authorities, validate_authority_registry
          from app.behavior.decision_spine.market_primitive_kernel_v2 import build_market_primitive_kernel_v2
          from app.behavior.decision_spine.canonical_candle_morphology_v2 import build_canonical_candle_morphology_v2
          from app.behavior.decision_spine.canonical_chart_state_v2 import build_canonical_chart_state_v2
          from app.behavior.decision_spine.canonical_market_structure_v2 import build_canonical_market_structure_v2
          from app.behavior.decision_spine.canonical_level_graph_v2 import build_canonical_level_graph_v2
          from app.behavior.decision_spine.canonical_indicator_contracts_v2 import build_canonical_indicator_contracts_v2
          from app.behavior.decision_spine.evidence_graph import build_evidence_graph
          from app.behavior.decision_spine.canonical_evidence_graph_v2 import build_canonical_evidence_graph_v2
          assert validate_authority_registry() == ()
          assert [e.engine_id for e in all_engine_authorities() if e.may_set_final_band] == [FINAL_BAND_AUTHORITY]
          assert all(not e.may_execute for e in all_engine_authorities())
          assert all(callable(x) for x in (build_market_primitive_kernel_v2,build_canonical_candle_morphology_v2,build_canonical_chart_state_v2,build_canonical_market_structure_v2,build_canonical_level_graph_v2,build_canonical_indicator_contracts_v2,build_evidence_graph,build_canonical_evidence_graph_v2))
          PY
