name: M4 Reference Order Append V2
on:
  push:
    branches:
      - m4-d6-orchestration-redesign
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append planning order
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/M4_TRADING_COGNITIVE_ARCHITECTURE_REFERENCE_2026-09-10.md')
          marker = '## Agreed think-engine planning order — 2026-09-10'
          text = p.read_text(encoding='utf-8')
          if marker not in text:
              text += '''\n\n---\n\n## Agreed think-engine planning order — 2026-09-10\n\nThis is the current order for creating separate improvement/update plans for the existing thinking engines. It is a planning priority list, not an implementation-completion claim and not a change to final authority.\n\n1. **Hypothesis Box** — first priority. Build stronger thesis / anti-thesis generation, explicit required evidence, invalidators, expiry, expected sequence, and failure paths.\n2. **Twin** — second. Improve disagreement, contradiction, and competing-explanation detection. Twin remains a reviewer/compatibility component; canonical M4 conflict reasoning remains broader than Twin.\n3. **ORB + AFRE** — third. Strengthen strategy-specialist reasoning after hypothesis/conflict logic is defined; preserve safety/proof gates and proposal-only authority.\n4. **Kronos** — fourth. Upgrade toward real validated sequence/candlestick intelligence; mock/fallback output remains research-only and must not influence canonical decisions.\n5. **Indicators / M3.1 Price Proof** — fifth. Improve indicator ontology, multi-horizon interpretation, relationship/dependency reasoning, and efficiency while preserving locked M3.1 contracts and evidence provenance.\n6. **9-Candle Real Album / M3.3 Memory Proof** — sixth. Improve interpretation, retrieval quality, contextual matching, and speed without weakening the canonical real/PIT-safe route.\n7. **History + Pattern Diary / M3.3 Memory Proof** — seventh. Deepen analog, sequence-transition, failure-pattern, regime-conditioned, and historical reasoning after core memory handling is stable.\n8. **Old Fake / Mock Album** — never integrate into production reasoning. Keep strictly outside the canonical path for practice, fixtures, and research-only testing.\n\nShort planning sequence:\n\n```text\nHypothesis Box\n    -> Twin\n    -> ORB / AFRE\n    -> Kronos\n    -> Indicators / M3.1\n    -> 9-Candle Real Memory / M3.3\n    -> History + Pattern Diary / M3.3\n    -> Old Fake Album remains outside production\n```\n\nFor each engine, the dedicated plan should begin by auditing current repository truth, identifying weak/broken/legacy functionality, separating canonical from mock paths, and defining measurable correctness, speed, safety, and acceptance tests before implementation.\n'''
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add docs/M4_TRADING_COGNITIVE_ARCHITECTURE_REFERENCE_2026-09-10.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: record think-engine planning order"
          git push origin HEAD:m4-d6-orchestration-redesign
