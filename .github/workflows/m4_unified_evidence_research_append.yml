## 31.31 Final merged design principle

The unified Trade Vision reasoning engine should aim to know **what each observation means, what it does not mean, how it was calculated, when it became knowable, which other observations share its information, which market problem makes it relevant, what alternative explanation competes with it, and how the thesis can fail**.

The system becomes stronger by combining these relationships, not by forcing every sensor into one number.

Canonical summary:

```text
TRUTHFUL DATA
-> VERSIONED MARKET FACTS
-> SEMANTIC EVIDENCE
-> CONTEXT / PHASE
-> RELATIONSHIP + INDEPENDENCE GRAPH
-> THESIS + ANTI-THESIS
-> FAILURE / SCENARIO / COUNTERFACTUAL CHALLENGE
-> ROBUSTNESS / OOD / UNCERTAINTY
-> D6 SOLE FINAL AUTHORITY
-> WAIT / WATCH / PAPER-CANDIDATE
```

