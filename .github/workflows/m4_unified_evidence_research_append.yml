name: M4 Unified Evidence Research Append

on:
  push:
    branches:
      - m4-d6-orchestration-redesign

permissions:
  contents: write

jobs:
  append-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: m4-d6-orchestration-redesign
          fetch-depth: 0

      - name: Append research fragment if missing
        shell: bash
        run: |
          target="docs/M4_TRADING_COGNITIVE_ARCHITECTURE_REFERENCE_2026-09-10.md"
          fragment="docs/.m4_unified_evidence_research_fragment_2026-09-10.md"
          marker="# 31. Unified Market Evidence and Reasoning Architecture — research upgrade"
          if grep -Fq "$marker" "$target"; then
            echo "Research section already present."
          else
            printf '\n\n---\n\n' >> "$target"
            cat "$fragment" >> "$target"
            printf '\n' >> "$target"
          fi

      - name: Commit merged reference
        shell: bash
        run: |
          target="docs/M4_TRADING_COGNITIVE_ARCHITECTURE_REFERENCE_2026-09-10.md"
          if git diff --quiet -- "$target"; then
            echo "No reference changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "docs: merge unified market evidence reasoning research"
          git push origin HEAD:m4-d6-orchestration-redesign
