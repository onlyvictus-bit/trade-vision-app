name: M4 Unified Evidence Research Append

on:
  push:
    branches:
      - m4-d6-orchestration-redesign

permissions:
  contents: write

jobs:
  append-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: m4-d6-orchestration-redesign
          fetch-depth: 0

      - name: Merge unified market-evidence research into architecture reference
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/M4_TRADING_COGNITIVE_ARCHITECTURE_REFERENCE_2026-09-10.md")
          marker = "# 31. Unified Market Evidence and Reasoning Architecture — research upgrade"
          section = r'''
# 31. Unified Market Evidence and Reasoning Architecture — research upgrade

Date merged: 2026-09-10
Status: RESEARCH-BACKED ARCHITECTURE REFERENCE — NOT AN IMPLEMENTATION-COMPLETE CLAIM

This section merges the deeper market-evidence research into the existing M4 cognitive architecture reference. It strengthens the earlier plan; it does not erase the earlier sections, the agreed think-engine planning order, locked M0–M3 behavior, D1/D2 safety, or D6 sole-final-authority rule.

The engineering target is broad, context-sensitive, adversarially challenged market reasoning. It must remain bounded, deterministic where required, replayable, point-in-time safe, explicit about missing information, and research/paper-guidance only.

## 31.1 Core rule: evidence is typed information, not a vote

The unified system must not reason like this:

```text
EMA bullish
+ RSI bullish
+ VWAP bullish
+ OBV bullish
+ MACD bullish
= BUY
```

That loses semantics and can count the same underlying information many times.

The stronger canonical flow is:

```text
D1 SAFETY / DATA INTEGRITY
        -> D2 CLOSED PIT SNAPSHOT
        -> MARKET FACT KERNEL
        -> VERSIONED TYPED EVIDENCE
        -> MARKET PHASE / ACTIVE QUESTION
        -> RELEVANCE ROUTER
        -> DEPENDENCY + RELATIONSHIP GRAPH
        -> COMPETING HYPOTHESES
        -> THESIS / ANTI-THESIS
        -> FAILURE-PATH SEARCH
        -> SCENARIOS
        -> COUNTERFACTUALS
        -> ADVERSARIAL CHALLENGE
        -> OOD / UNCERTAINTY / ROBUSTNESS
        -> D6 SOLE FINAL ARBITRATION
        -> WAIT / WATCH / PAPER-CANDIDATE
```

A market sensor may answer one or more specific questions:

- direction;
- trend persistence;
- momentum/acceleration;
- structural location;
- value/auction location;
- volatility state;
- participation;
- liquidity/rejection risk;
- derivatives positioning or convexity;
- market context;
- historical similarity;
- plausible future sequence.

No sensor receives final authority merely because it is popular or visually persuasive.

## 31.2 Canonical market-fact contract

Every decision-affecting observation should eventually carry an explicit contract similar to:

```text
EvidenceFact
  evidence_id
  feature_id
  family
  subfamily
  formula_id
  formula_version
  parameter_hash
  source_id
  source_snapshot_hash
  source_timeframe
  effective_horizon
  confirmation_time
  decision_time
  value
  normalized_state
  direction_semantics
  location_semantics
  market_role
  market_phase
  freshness_state
  PIT_state
  availability_state
  quality_state
  dependency_keys[]
  correlation_group
  independent_episode_key
  supports[]
  contradicts[]
  requires[]
  invalidates[]
  conditional_on[]
  uncertainty
  allowed_conclusions[]
  forbidden_conclusions[]
  warnings[]
  evidence_hash
```

Important invariants:

```text
same label + different formula/config != same fact
same price source != independent confirmation
same event seen through multiple indicators != multiple independent episodes
missing input != numeric zero
calculation error != no signal
unconfirmed pivot != confirmed structure
unfinished HTF bar != closed HTF evidence
```

## 31.3 Price Structure intelligence

Price Structure answers: **Where is price structurally, and what has price actually proven?**

| Feature | Canonical interpretation | Calculation / state requirement | Primary use | Major failure risk |
| --- | --- | --- | --- | --- |
| Support / Resistance | Dynamic reaction zone, not magical exact line | confirmed swing/auction/level sources; zone width versioned, preferably volatility-aware | location, target obstruction, invalidation context | stale/over-tested levels; hindsight pivots |
| HH / HL / LH / LL | swing sequence | only confirmed pivots; keep forming vs confirmed separate | trend structure and transitions | future-pivot leakage |
| BOS | continuation-style structural break | define exact swing source, close/wick policy, breakout buffer and confirmation bar | continuation evidence | wick-only false break |
| CHOCH | potential structural character change | break against prior structural sequence; confirmation required | reversal/transition hypothesis | treating first counter-swing as full reversal |
| PDH / PDL | prior completed session high/low | previous trading session only, exchange calendar aware | opening liquidity, breakout/rejection location | session/calendar mistakes |
| CPR | central pivot range | P=(H+L+C)/3; BC=(H+L)/2; TC=2P-BC, using prior completed period | value/location and compression context | treating narrow/wide CPR as universal forecast without validation |
| Classic pivots | deterministic reference levels | R1=2P-L, S1=2P-H; R2=P+(H-L), S2=P-(H-L); version any R3/S3 variant | location, reaction, targets | level crowding and formula mismatch |
| Fibonacci | swing-relative candidate location | ratios and swing anchors explicit/versioned | low-authority confluence candidate | discretionary anchoring; unproven standalone edge |

Fibonacci must never become a promotion gate by itself. External empirical work has found no universal statistically special bounce property that justifies treating Fibonacci levels as a market law. Trade Vision should measure its own conditional incremental value by stock, timeframe, phase and regime before granting material authority.

Structural states should be represented semantically. Example:

```text
STRUCTURE_5M:
  trend_sequence = HH_HL
  latest_confirmed_event = BOS_UP
  forming_event = NONE
  distance_to_daily_resistance_atr = 0.28
  structural_state = BULLISH_BUT_OBSTRUCTED
```

That is more useful than `structure_score=0.72`.

## 31.4 Liquidity / smart-money-structure intelligence

Liquidity Structure answers: **Where may price be probing, rejecting, filling imbalance, or triggering clustered orders?**

Canonical concepts:

- chart order blocks;
- fair value gaps (FVG);
- liquidity sweeps;
- swing-failure patterns (SFP);
- inferred stop zones.

Important epistemic rule:

```text
chart-derived order block != observed institutional order
chart-derived stop zone != observed stop inventory
FVG != guaranteed future fill
```

These are OHLCV-derived structural proxies unless Trade Vision has direct order-book/order-flow evidence. Their schema must state `inference_type=CHART_DERIVED_PROXY` rather than implying hidden institutional facts.

Suggested FVG contract should explicitly version the geometry. A common three-candle form is:

```text
bullish_gap when low[t] > high[t-2]
bearish_gap when high[t] < low[t-2]
```

but the production contract must also define body/wick policy, minimum gap size, ATR normalization, mitigation/fill state and expiry.

A liquidity sweep should require a sequence, not one candle label:

```text
known liquidity/reference level
-> price trades beyond level
-> failure to accept beyond level
-> closes/re-enters expected region
-> optional displacement/participation confirmation
```

SFP reasoning should distinguish:

- attempted breakout;
- excursion size;
- close location;
- reclaim speed;
- volume/RVOL;
- higher-timeframe location;
- repeated tests;
- next-bar confirmation.

Liquidity intelligence is particularly important for the anti-thesis of a breakout.

## 31.5 Value / Auction intelligence

Value/Auction answers: **Where has the market accepted business, and is current price near, above or below that value?**

### VWAP

Canonical session VWAP:

```text
typical_price = (high + low + close) / 3
VWAP = cumulative_sum(typical_price * volume) / cumulative_sum(volume)
```

The exact price basis must be configurable and versioned because some systems use close or alternative price bases.

Use VWAP for:

- session value location;
- reclaim/loss sequence;
- breakout acceptance context;
- pullback-to-value context;
- side veto when a strategy requires it.

Do not use `price > VWAP` as a universal long signal.

### Anchored VWAP

Anchored VWAP uses the same weighted-average principle but resets at an explicit causal anchor, for example:

- session open;
- confirmed swing;
- event time;
- breakout event;
- earnings/result event;
- prior major gap.

Every AVWAP must store `anchor_type`, `anchor_time`, `anchor_reason`, and `anchor_available_at_decision_time`. A hindsight-selected anchor is not PIT-safe evidence.

### VWAP bands

All VWAP envelopes must store the actual multiplier rather than only a display name:

```text
vwap_band:
  center = VWAP
  dispersion_method = VOLUME_WEIGHTED_RUNNING_STD
  sigma_multiplier = 1.0
  reset = SESSION
```

Repository-specific correction to preserve in future implementation work: a current legacy Trade Vision VWAP helper uses multipliers `0.5, 1.0, 1.5` while labeling outputs as upper/lower `1,2,3`. Other designs may mean `1,2,3` standard deviations. These must never be merged under the same canonical identifiers without formula/config identity.

### POC / VAH / VAL / Volume Profile

Volume Profile should be a versioned volume-at-price approximation or exchange-derived profile when real source data permits.

Contract must define:

- session/window;
- price binning method;
- number/width of bins;
- volume allocation method;
- value-area percentage;
- POC tie-breaking;
- whether input is actual trade-at-price data or candle-distributed approximation.

POC = price/bin with the greatest modeled volume concentration.

VAH/VAL = upper/lower boundaries of the chosen value-area mass, commonly configured around 70%, but the percentage is a parameter, not a universal law.

Volume Profile is mainly **location and acceptance context**, not a standalone next-direction forecast.

## 31.6 Volatility intelligence

Volatility answers: **How much is price moving, how unusual is the movement regime, and is volatility compressing or expanding?**

### ATR

```text
TR[t] = max(
    high[t] - low[t],
    abs(high[t] - close[t-1]),
    abs(low[t] - close[t-1])
)
ATR = versioned smoothing of TR, commonly Wilder/RMA over 14 bars
```

ATR is non-directional. Use it for:

- normalized level distance;
- breakout extension;
- stop/target scale research;
- gap magnitude;
- volatility regime;
- buffer sizing;
- comparing instruments/timeframes.

### Bollinger Bands

Classic default representation should be explicit:

```text
middle = SMA(close, 20)
upper = middle + 2 * rolling_std
lower = middle - 2 * rolling_std
```

If Trade Vision also calculates +/-1 sigma and +/-3 sigma envelopes, those are valid extensions but must be named and versioned as such rather than presented as if classic Bollinger Bands require all three.

Useful derived facts:

```text
band_width = (upper - lower) / abs(middle)
percent_b = (close - lower) / (upper - lower)
```

Band touches are not automatic buy/sell instructions. A strong trend can walk a band.

### Keltner Channel

Canonical contract should explicitly define center and ATR multiplier, for example:

```text
center = EMA(close, 20)
upper = center + k * ATR
lower = center - k * ATR
```

A BB-inside-KC condition can be a compression observation; release from compression is a possible expansion hypothesis, not guaranteed direction.

### Compression / Expansion

Compression should combine multiple facts where useful:

- BB width percentile;
- ATR percentile;
- BB/KC relationship;
- realized range contraction;
- volume behavior;
- structural range duration.

Expansion should require realized follow-through/acceptance, not merely a volatility indicator turning up.

## 31.7 Trend intelligence

Trend answers: **What direction and persistence exist at each effective horizon?**

### EMA 9 / 20-or-21 / 50 / 200

EMA recurrence:

```text
alpha = 2 / (period + 1)
EMA[t] = alpha * price[t] + (1-alpha) * EMA[t-1]
```

The four averages must remain distinct observations with explicit roles, for example:

```text
EMA9   -> fast impulse / immediate trend
EMA20  -> short-medium intraday trend
EMA50  -> structural intraday trend
EMA200 -> slow/background structure on that source timeframe
```

But they share underlying price dependency. Four bullish EMAs are not four independent proofs.

Useful relationship facts:

- slope normalized by price, ATR and/or elapsed time;
- separation in basis points or ATR units;
- ordered stack;
- compression of averages;
- cross age;
- price distance from stack;
- stack persistence.

Example:

```text
EMA9 > EMA20 > EMA50
all slopes rising
separation expanding
price not excessively extended
=> coherent same-timeframe trend structure
```

Different example:

```text
EMA9 > EMA20
EMA20 < EMA50
EMA50 falling
=> fast recovery inside still-bearish structural state
=> possible countertrend rally / short covering / early reversal
```

### Multi-timeframe law

A longer moving average on 5m data is not equivalent to a true 1H trend. Higher-timeframe evidence must come from closed native higher-timeframe bars or validated closed-bar resampling.

### Supertrend

Treat Supertrend as an ATR-based trailing trend-state sensor. Contract must version ATR method, multiplier, band update rules and flip semantics. It is related to price/ATR and therefore not independent of all trend/volatility evidence.

### Ichimoku

Model its components separately rather than reducing the entire system to one bullish flag:

- Tenkan state;
- Kijun state;
- cloud state;
- price/cloud location;
- Tenkan/Kijun relationship;
- cloud thickness;
- trailing-only decision-safe representation.

Forward-shifted visual clouds must not introduce future information into the decision timestamp.

## 31.8 Momentum intelligence

Momentum answers: **Is the move accelerating, decelerating, stretched, diverging, or transitioning?**

### RSI

A common Wilder RSI contract:

```text
RS = smoothed_gain / smoothed_loss
RSI = 100 - 100/(1+RS)
```

RSI state should include:

- numeric value;
- slope;
- regime-adjusted zone;
- range shift;
- divergence state;
- confirmation age.

`RSI=75` is not inherently bearish. During a high-participation trend it can describe strength; at exhausted resistance after a liquidity sweep it can support an anti-thesis.

### MACD

Common configuration:

```text
MACD = EMA12 - EMA26
signal = EMA9(MACD)
histogram = MACD - signal
```

Store sign, slope, histogram change, cross age and zero-line context rather than only cross direction.

### Stochastic

```text
%K = 100 * (close - lowest_low_N) / (highest_high_N - lowest_low_N)
%D = smoothed(%K)
```

Most useful for location/turning behavior in ranges or pullbacks; high values can persist in trends.

### ADX / DMI

ADX is primarily trend-strength information, not bullish/bearish direction. Directional context belongs to +DI/-DI and other trend/structure evidence.

### Divergences

Divergences require confirmed pivots and therefore have delay. Store:

- pivot timestamps;
- confirmation timestamp;
- price pivot relation;
- oscillator pivot relation;
- hidden/regular type;
- direction;
- distance/age;
- location context.

Never backdate divergence evidence to before its pivot became knowable.

## 31.9 Participation intelligence

Participation answers: **Is trading activity supporting, rejecting or failing to confirm the price story?**

### Volume

Use absolute volume only with instrument/session context. Opening volume is naturally different from midday volume.

### RVOL

For intraday NSE reasoning, prefer seasonality-aware relative volume where possible:

```text
RVOL_time = current cumulative or bar volume
            / historical expected volume for same elapsed session time
```

This is usually more meaningful than comparing 09:20 volume with a full-session average.

### OBV

```text
if close[t] > close[t-1]: OBV += volume[t]
if close[t] < close[t-1]: OBV -= volume[t]
else: unchanged
```

Use trend/divergence behavior, not raw OBV level across unrelated instruments.

### CMF

A common form:

```text
money_flow_multiplier = ((close-low) - (high-close)) / (high-low)
money_flow_volume = multiplier * volume
CMF = sum(money_flow_volume, N) / sum(volume, N)
```

Zero-range bars require explicit safe handling.

### MFI

MFI combines typical-price changes and volume into positive/negative money-flow ratios. Treat it as a price-volume momentum sensor, not independent from RSI+volume families.

Dependency rule:

```text
Volume + RVOL + OBV + CMF + MFI
can provide richer participation description
but must not be counted as five independent confirmations.
```

## 31.10 Derivatives intelligence

Derivatives answers: **What positioning, volatility expectations, strike structure and convexity forces may change the path?**

### Price + OI change

The classic four-state classification is contextual evidence:

```text
price up   + OI up   -> LONG_BUILDUP candidate
price down + OI up   -> SHORT_BUILDUP candidate
price up   + OI down -> SHORT_COVERING candidate
price down + OI down -> LONG_UNWINDING candidate
```

Open interest counts outstanding contracts; it does not reveal the directional intent of all participants by itself.

### Futures OI

Track:

- current OI;
- delta and percent delta;
- price change;
- expiry;
- contract migration;
- rollover;
- basis;
- participant data where legally/technically available.

### Call / Put OI

Strike OI should be treated as positioning/interest concentration. Large call OI is not automatically resistance and large put OI is not automatically support. Interpretation depends on whether positions are long/short, changes in OI, price/IV movement, expiry and participant composition.

### PCR

Always identify numerator/denominator and data type:

```text
PCR_OI = total_put_OI / total_call_OI
PCR_VOLUME = put_volume / call_volume
```

Do not mix OI-PCR and volume-PCR under one feature id.

### Implied Volatility

IV is the volatility parameter implied by option prices under the specified pricing/inversion method. It expresses expected magnitude/uncertainty rather than bullish/bearish direction.

Store whether IV is:

- exchange/vendor supplied;
- independently solved;
- model/version;
- spot/forward assumptions;
- rate/dividend assumptions;
- time-to-expiry convention.

### IV Rank

One common form:

```text
IV_rank = 100 * (current_IV - min_IV_window) / (max_IV_window - min_IV_window)
```

Window length and observation frequency must be explicit. A tiny sample cannot be called a meaningful annual IV rank.

### Skew

For 25-delta skew, define exact convention. A common equity-options representation compares put IV and call IV near absolute 25 delta. Positive put-minus-call skew can indicate richer downside protection pricing, but it is not a direct next-candle direction signal.

### Max pain

If used, calculate from the chosen option-chain snapshot by estimating aggregate intrinsic payout across candidate settlement strikes. Store chain completeness, expiry and contract multiplier. Treat max pain as low/moderate contextual evidence whose conditional usefulness should be empirically tested, especially near expiry.

### Gamma / GEX

Keep these separate:

```text
unsigned_gamma_exposure
signed_position_gamma_exposure
assumed_dealer_gamma_exposure
observed/known dealer-position gamma exposure
```

Open interest alone does not identify dealer side. Trade Vision's existing rule that dealer-signed GEX is unavailable without explicit dealer-position sign should remain a canonical law.

### Vanna / Charm

Use as expiry/volatility-path modifiers. Their practical effect depends on time-to-expiry, underlying move, implied-volatility move, position sign and dealer positioning assumptions. They should not become standalone directional votes.

### Rollover

Rollover should compare expiring vs next-contract OI migration with contract identity and time. High rollover plus positive/negative basis can describe positioning persistence, but interpretation remains contextual.

### Basis

A simple observed futures basis:

```text
basis_bps = (futures_price - spot_price) / spot_price * 10_000
```

For fair-value conclusions, carry cost, dividends, time and instrument convention must be considered. Store raw observed basis separately from fair-value-adjusted basis.

## 31.11 Market Context intelligence

Market Context answers: **Is the stock's local thesis aligned with or fighting its environment?**

Required contextual families:

- Nifty / relevant benchmark;
- sector index;
- stock relative strength;
- market breadth;
- India VIX;
- events.

### Nifty and sector

Represent both structure and return state at compatible horizons. Example:

```text
stock_5m = bullish breakout
sector_5m = falling
nifty_5m = flat
stock_relative_strength = strong
```

This is not automatically invalid. It may describe true stock-specific leadership. M4 should ask whether the move is strong enough to survive environmental headwind and whether history supports that pattern.

### Relative strength

Define benchmark and horizon explicitly, for example:

```text
RS_return = stock_return_horizon - benchmark_return_horizon
```

More advanced implementations may use volatility/beta normalization, but raw and adjusted forms must remain separately identified.

### Breadth

Breadth contract must define universe and calculation, for example:

- advancing vs declining constituents;
- percent above VWAP;
- percent above EMA20/50;
- up-volume/down-volume;
- sector participation.

A changing universe must not silently change historical comparability.

### India VIX

India VIX is expected-volatility context, not a bullish/bearish direction signal. Use level, regime, change, shock and trend as risk/volatility context.

### Events

Events require point-in-time availability and event-time identity. Important classes can include:

- company results;
- RBI policy;
- Budget/election sessions;
- corporate actions;
- exchange restrictions;
- F&O ban/MWPL states;
- major scheduled macro releases.

Unknown or stale event state cannot be treated as `NO_EVENT`.

## 31.12 Memory intelligence

Memory answers: **Have we seen comparable states, what happened next, and how did similar cases fail?**

### Real 9-candle memory

The canonical route should remain:

```text
last 9 CLOSED bars
+ current M3.1 evidence
+ PIT-safe stored episodes
+ delayed labels only after label availability time
+ snapshot/time/hash verification
```

Improve retrieval and interpretation, not by reintroducing mock album data.

### Pattern diary

Store transition narratives, not merely labels:

```text
state_before
-> approach sequence
-> level interaction
-> breakout/rejection
-> value/VWAP behavior
-> participation behavior
-> context
-> derivatives context
-> outcome path
-> failure path
```

### Similar setups

Similarity should use:

- exact feature schema/version;
- missing masks;
- stock/timeframe/regime/phase filters where appropriate;
- deterministic distances;
- bounded top-k;
- sample sufficiency;
- episode independence.

Ten almost-identical correlated episodes from the same event are not ten independent proofs.

### Failure memory

Failure trajectories deserve first-class storage. Example:

```text
approach resistance
-> breakout attempt
-> low acceptance
-> return below level
-> VWAP loss
-> RVOL collapse / opposite participation
-> accelerated reversal
```

This can be more useful to M4 than a single historical win-rate number.

## 31.13 Real validated Kronos

Kronos should be a sequence-model specialist, not an oracle.

Canonical influence rule:

```text
REAL MODEL
+ VERIFIED WEIGHTS
+ PIT-CLEAN INPUT
+ BENCHMARKED ON HELD-OUT NSE DATA
+ CALIBRATION / RELIABILITY RECEIPT
=> eligible as bounded sequence evidence

MOCK / FALLBACK / UNVERIFIED / OOD KRONOS
=> research-only
=> zero canonical decision influence
```

Evaluate Kronos against simple baselines and existing Trade Vision evidence. Useful outputs may include:

- plausible forward K-line paths;
- directional path distribution;
- realized-volatility distribution;
- breakout persistence probability only if actually calibrated;
- reversal/path-shape likelihood only if actually calibrated;
- uncertainty/OOD state.

Do not convert an uncalibrated model score into trade confidence.

A larger model is not automatically better for NSE intraday. Benchmark latency, horizon quality, calibration, robustness and OOS performance.

## 31.14 Research-backed semantic corrections that must become tests

These distinctions should become executable contract tests rather than documentation only:

1. `ATR_HIGH` means high movement/range, not bullish.
2. `VIX_UP` means expected volatility increased, not automatically bearish.
3. `ADX_HIGH` means trend strength, not automatically long.
4. `IV_HIGH` means options imply high volatility, not automatically long/short.
5. `OI_HIGH` means many outstanding contracts, not participant direction.
6. `CALL_OI_HIGH` does not automatically mean resistance.
7. `PUT_OI_HIGH` does not automatically mean support.
8. `BOLLINGER_UPPER_TOUCH` is not an automatic sell.
9. `BOLLINGER_LOWER_TOUCH` is not an automatic buy.
10. `FIBONACCI_LEVEL_TOUCH` is not sufficient to promote a thesis.
11. `ORDER_BLOCK` from charts is an inferred zone, not proof of institutional orders.
12. `FVG` is an imbalance geometry, not a guaranteed fill promise.
13. `VOLUME_PROFILE` is primarily location/acceptance information, not guaranteed forecast direction.
14. `SIGNED_DEALER_GEX` requires position-side evidence or an explicitly quarantined assumption.
15. multiple EMA/MACD/Supertrend facts do not become independent simply because their names differ.
16. multiple memory matches from one correlated episode do not become independent observations.
17. higher-timeframe state must be closed/confirmed at decision time.
18. an unavailable indicator/derivatives source must stay unavailable, not become zero/neutral.

## 31.15 Market phase and active-question router

The dynamic router should first answer: **What problem is the market currently presenting?**

Suggested top-level active questions:

```text
TREND_CONTINUATION
TREND_PULLBACK
BREAKOUT_ATTEMPT
BREAKOUT_ACCEPTANCE
BREAKOUT_FAILURE
LIQUIDITY_SWEEP
RANGE_MEAN_REVERSION
SQUEEZE_COMPRESSION
SQUEEZE_RELEASE
GAP_AND_GO
GAP_EXHAUSTION
EVENT_DISTORTION
EXPIRY_PINNING_OR_GAMMA
MULTI_TIMEFRAME_CONFLICT
NO_EDGE_CHOP
POST_ENTRY_THESIS_CHECK
```

The router should not delete nonselected evidence. It changes depth/priority of reasoning while retaining contradictions and hard safety facts.

Example breakout route:

```text
PRIMARY:
  structure + location
  VWAP/value
  volume/RVOL
  acceptance closes
  index/sector/RS
  nearby liquidity
  strike/OI structure

SECONDARY:
  trend stack
  momentum acceleration
  memory failures
  Kronos sequence evidence

CONDITIONAL:
  gamma/expiry effects when expiry context is material
  event state when event proximity exists
```

## 31.16 Unified case reasoning playbooks

### Case A — Trend continuation / pullback

Question: is this a healthy pullback inside an intact trend, or trend failure beginning?

Support thesis may require:

- higher-horizon structure intact;
- EMA horizon stack/slopes coherent;
- pullback into value/support rather than uncontrolled extension;
- VWAP/AVWAP/EMA/support interaction;
- participation contraction on pullback then expansion on response;
- index/sector not materially hostile;
- no dangerous event/derivatives obstruction;
- memory contains comparable successful pullbacks.

Anti-thesis searches for:

- CHOCH against trend;
- failure below value;
- lower high after rebound;
- expanding opposite participation;
- sector/index deterioration;
- nearby higher-timeframe resistance/support violation;
- memory failure trajectory.

D6 semantics:

```text
intact thesis + robust retest + no blocker -> PAPER-CANDIDATE eligible
intact but unresolved HTF/context conflict -> WATCH
structural invalidation / safety failure -> WAIT or AVOID semantics according to final product contract
```

### Case B — Breakout acceptance

Question: did price truly escape a level and gain acceptance?

Look for:

```text
confirmed level
-> close beyond level with defined buffer
-> participation/RVOL support
-> hold or successful retest
-> VWAP/value alignment
-> structural continuation
-> acceptable extension vs ATR
-> supportive or at least non-hostile index/sector
-> no dominant OI/liquidity/event obstruction
```

Anti-thesis = fake breakout / sweep / exhaustion.

Do not promote on `close > resistance` alone.

### Case C — False breakout / liquidity sweep reversal

Question: was the apparent breakout actually rejection?

Strong narrative:

```text
known level
-> excursion beyond level
-> failed acceptance
-> re-entry
-> SFP/sweep structure
-> opposite displacement
-> VWAP/value loss/reclaim in reversal direction
-> participation confirms rejection
```

Memory should compare against prior false-break trajectories. Kronos may challenge with alternative continuation paths but cannot override real rejection evidence.

### Case D — Range / mean reversion

Question: is price auctioning inside established value rather than trending?

Potential evidence:

- weak/flat structural progression;
- low ADX or other weak-trend state;
- price repeatedly returns through VWAP/POC;
- stable VAH/VAL/range boundaries;
- oscillating momentum;
- failed edge breakouts;
- moderate/declining volatility.

Do not apply trend-continuation logic to the middle of a range. Range-edge reversal hypotheses should weaken when participation/volatility expands and acceptance develops outside value.

### Case E — Compression -> expansion

Question: is volatility compressed and beginning genuine expansion?

Compression evidence can combine:

- low BB width percentile;
- BB/KC squeeze relation;
- ATR contraction;
- narrowing structural range;
- reduced realized movement.

Expansion confirmation may require:

- range break;
- increasing BB width/ATR;
- participation expansion;
- value/VWAP acceptance;
- structural BOS;
- supportive context.

Direction comes from structure/acceptance/context, not from compression itself.

### Case F — Gap-and-go vs gap exhaustion

Question: is the opening gap attracting continuation or representing an overextended move vulnerable to fade?

Normalize gap by ATR and corporate-action adjustment. Compare:

- gap magnitude;
- opening-drive acceptance;
- OR structure;
- VWAP relation;
- RVOL;
- index/sector alignment;
- event catalyst;
- prior-day levels;
- derivatives state;
- historical same-stock gap behavior.

Extreme gap + weak acceptance + nearby major resistance + fading participation can strengthen exhaustion anti-thesis.

### Case G — Multi-timeframe conflict

Example:

```text
5m bullish BOS + EMA stack
15m transition
1H bearish structure near resistance
```

Do not average these into neutral. Represent:

```text
FAST = bullish opportunity
MEDIUM = transition
HIGHER = bearish headwind
```

Then ask whether the strategy horizon can complete before higher-timeframe opposition is likely to dominate. This can cap a candidate to WATCH even when fast evidence is strong.

### Case H — Event shock / event-distorted market

Question: are normal technical relationships reliable right now?

Event state can:

- veto pending entries;
- widen uncertainty;
- invalidate historical analog comparability;
- change volatility regime;
- make option IV/skew more important;
- reduce value of lagging indicators.

Unknown event status should not be treated as no event.

### Case I — Expiry / pinning / convexity

Near expiry, increase relevance of:

- strike concentration;
- spot-to-major-strike distance;
- gamma state;
- IV term structure;
- skew;
- charm/vanna context;
- rollover/basis;
- max-pain distance as low-authority context.

Do not let assumed dealer positioning become observed fact. If dealer sign is unknown, signed-GEX reasoning stays unknown or explicitly scenario-based.

### Case J — No edge / chop

The engine should be capable of concluding that no coherent thesis deserves promotion.

Typical evidence:

- repeated conflicting breaks;
- no stable structure;
- value crossing repeatedly;
- low/erratic participation;
- high evidence conflict;
- insufficient memory sample;
- missing derivatives/context needed by the active case;
- fragile result that flips under small counterfactual changes.

Correct output is `WAIT`, not a forced directional prediction.

## 31.17 Hypothesis Engine v2 consumption contract

Hypothesis Engine v2 should consume immutable evidence; it should not recompute the market independently.

Every hypothesis should contain at minimum:

```text
hypothesis_id
hypothesis_type
direction
source_timeframe
effective_horizon
market_phase
thesis
required_facts[]
supporting_evidence_ids[]
opposing_evidence_ids[]
unknown_required_evidence[]
anti_thesis_id
invalidators[]
expected_sequence[]
expected_failure_sequence[]
expiry_condition
regime_assumptions[]
fragility_factors[]
OOD_state
robustness_state
```

Candidate library:

```text
LONG_CONTINUATION
LONG_REVERSAL
SHORT_CONTINUATION
SHORT_REVERSAL
BREAKOUT_FOLLOW_THROUGH
BREAKOUT_FAILURE
RANGE_MEAN_REVERSION
SQUEEZE_EXPANSION
GAP_AND_GO
GAP_EXHAUSTION_FADE
LIQUIDITY_SWEEP_REVERSAL
TREND_PULLBACK
EVENT_DISTORTED_MARKET
CHOP_NO_EDGE
```

No hypothesis may invent fallback S/R, entry, invalidation or confirmation boundaries when the required level is unavailable.

No hand-built rule score may be renamed probability unless a PIT-clean calibration program proves that semantics.

## 31.18 Relationship and independence graph

Replace broad correlation buckets with explicit graph edges.

Suggested edges:

```text
DERIVED_FROM
SHARES_INPUT_WITH
CORRELATED_WITH
CONFIRMS
CONTRADICTS
REQUIRES
INVALIDATES
LEADS
LAGS
CONDITIONAL_ON
LOCATION_CONTEXT
FAILURE_PRECURSOR
REGIME_DEPENDENT
TIMEFRAME_PARENT
TIMEFRAME_CHILD
SAME_EPISODE_AS
```

Example:

```text
EMA9  SHARES_INPUT_WITH EMA20
EMA20 SHARES_INPUT_WITH EMA50
MACD  DERIVED_FROM close
Supertrend DERIVED_FROM price + ATR

BOS_UP CONFIRMED_BY acceptance_close
BOS_UP CONFIRMED_BY RVOL_EXPANSION
BOS_UP CONTRADICTED_BY SFP_DOWN
BOS_UP CONDITIONAL_ON breakout_level_confirmed

LONG_BREAKOUT THREATENED_BY daily_resistance
LONG_BREAKOUT THREATENED_BY call_strike_concentration
LONG_BREAKOUT INVALIDATED_BY accepted_reentry_below_level
```

Independent support should count evidence families/episodes only when the graph supports independence, not because there are many nodes.

## 31.19 Failure engine

Failure prediction should run before D6 promotion.

Required failure classes include at least:

```text
FALSE_BREAKOUT
NO_ACCEPTANCE
OR_TOO_WIDE
OR_TOO_NARROW
GAP_EXHAUSTION
EVENT_SHOCK
VIX_SHOCK
DOUBLE_STOP_WHIPSAW
HTF_OPPOSITION
VALUE_REJECTION
OI_WALL_REJECTION
EXPIRY_PINNING
ROLLOVER_DISTORTION
LIQUIDITY_DRY_UP
FEED_STALE
BAD_TICK
PIT_FAILURE
OOD
MEMORY_SAMPLE_TOO_SMALL
EDGE_DECAY
```

For each active thesis, produce:

- likely failure path;
- dangerous failure path;
- earliest observable precursor;
- confirming precursor;
- invalidation event;
- whether failure risk caps PAPER-CANDIDATE to WATCH.

## 31.20 Counterfactual and adversarial challenge

Before promotion, run bounded deterministic challenges such as:

```text
remove strongest supporting evidence
remove correlated duplicate evidence
reverse index context
reverse sector context
mark one important feed STALE
remove memory support
replace memory with OOD
remove Kronos
add nearby higher-authority resistance
introduce a liquidity sweep alternative
increase event risk
add contradictory derivatives evidence
```

The question is not `does score stay above threshold?`

The question is:

```text
Does the same thesis remain logically valid?
Does its required evidence remain satisfied?
Does a stronger anti-thesis emerge?
Does the final band change?
Is the decision single-factor dependent?
```

## 31.21 D6 target semantics — categorical arbitration, not weighted master score

The current D6 v1.75 weighted-score implementation is a migration baseline, not the target reasoning model for M4.

Target D6 inputs should include semantic states such as:

```text
SAFETY
DATA_INTEGRITY
THESIS_STATE
ANTI_THESIS_MATERIALITY
REQUIRED_EVIDENCE_COVERAGE
INDEPENDENT_SUPPORT
CONFLICT_STATE
FAILURE_RISK
OOD_STATE
ROBUSTNESS
FRAGILITY
ENTRY_PLAN_AUTHORITY
```

Possible deterministic decision lattice:

```text
IF safety/integrity hard blocker
    -> WAIT / AVOID according to product-facing contract
ELSE IF thesis invalid
    -> WAIT
ELSE IF required evidence incomplete
    -> WAIT or WATCH
ELSE IF anti-thesis material + unresolved conflict
    -> WATCH
ELSE IF failure risk material or robustness fragile
    -> WATCH
ELSE IF thesis valid
     AND required evidence complete
     AND independent support sufficient
     AND anti-thesis survived/resolved
     AND no hard blocker
     AND failure challenge survived
     AND OOD acceptable
     AND robustness acceptable
    -> PAPER-CANDIDATE
```

D6 remains the **only** final-band authority and remains non-executing.

## 31.22 Calculation normalization and compatibility layer

Before deep unification, formula identity must be standardized.

Create a `CalculationDefinition` / registry layer containing:

```text
feature_id
formula_id
formula_version
parameters
units
input_schema
input_timeframe
minimum_history
warmup_policy
session_reset_policy
anchor_policy
pivot_confirmation_policy
missing_policy
error_policy
PIT_policy
output_schema
```

Specific migration checks:

1. Resolve all VWAP band naming/multiplier mismatches.
2. Resolve all BB band naming/multiplier mismatches.
3. Version alternative pivot formulas.
4. Version every volume-profile bin/allocation method.
5. Distinguish native HTF from resampled HTF.
6. Distinguish confirmed pivots from forming pivots.
7. Distinguish chart-inferred SMC proxies from observed order-flow facts.
8. Distinguish supplied IV from locally solved IV.
9. Distinguish unsigned GEX from signed/assumed dealer GEX.
10. Distinguish OI-PCR from volume-PCR.
11. Distinguish raw basis from fair-value-adjusted basis.
12. Reject same feature id when formula/config identities disagree.

## 31.23 Runtime design for speed and resilience

The target should feel intelligent because it reuses a coherent world model, not because it repeatedly runs 94 independent calculators.

### Market Fact Kernel

Compute shared primitives once:

```text
OHLCV arrays
returns
true range / ATR
rolling min/max
EMA family
SMA/std family
session boundaries
VWAP accumulators
volume baselines
confirmed pivots
swing state
price-level distances
resampled CLOSED timeframe bars
```

### Dependency DAG

Indicators consume reusable primitives rather than recalculating them independently.

Example:

```text
close -> EMA9/20/50/200 -> stack/separation/slopes
TR -> ATR -> Supertrend/Keltner/ATR-normalized distances
session TPV -> VWAP -> VWAP bands/value state
rolling high/low -> stochastic/structure/pivots
volume baseline -> RVOL -> participation state
```

### Incremental state

Maintain safe rolling state for streaming/replay where equivalent to batch calculation:

- EMA;
- Wilder ATR/RSI/ADX components;
- rolling volume baselines;
- VWAP accumulators;
- BB/KC rolling state;
- confirmed swing state;
- profile buckets.

Every incremental algorithm needs batch-equivalence tests.

### Cache identity

Use at least:

```text
snapshot_hash
+ source_timeframe
+ formula_version
+ parameter_hash
+ relevant window hash
```

Never cache by symbol alone.

### Bounded reasoning

Set tested bounds for:

- evidence nodes;
- active hypotheses;
- conflicts;
- memory matches;
- scenarios;
- counterfactuals;
- receipt bytes;
- CPU/memory per decision.

No network call, corpus scan, or required LLM call inside deterministic D6.

## 31.24 Error semantics — make the canonical path non-silent

Legacy indicator wrappers may return empty lists/dicts on exceptions for compatibility. Canonical M4 must not interpret that as a genuine no-signal state.

Required canonical statuses:

```text
AVAILABLE
NO_SIGNAL
WARMUP
MISSING_INPUT
DEPENDENCY_UNAVAILABLE
STALE
UNCONFIRMED
ERROR
UNSUPPORTED
QUARANTINED
OOD
```

`ERROR`, `MISSING_INPUT`, `STALE`, `UNSUPPORTED`, and `QUARANTINED` are epistemic states and must survive into the receipt when material.

## 31.25 Robust engineering meaning of “non-breakable”

No market software is literally unbreakable. The engineering target should instead be:

- fail-closed;
- deterministic replay where required;
- immutable decision inputs;
- explicit schema/version migrations;
- backward-compatible adapters during migration;
- no silent data coercion;
- bounded compute;
- idempotent calculations;
- reproducible property tests;
- adversarial fixtures;
- corrupted/missing/stale data tests;
- exact-head CI gates;
- rollback path for every stage;
- no change to live-trading safety boundaries.

## 31.26 Required acceptance-test suite for this research upgrade

At minimum add future tests proving:

### Formula identity

- VWAP band multiplier is part of feature identity.
- Two `Band 1` implementations with different multipliers cannot merge silently.
- BB +/-1, +/-2, +/-3 extensions remain distinct from classic default representation.
- pivot/profile alternative formulas receive distinct version ids.

### Direction semantics

- ATR increase alone cannot set bullish/bearish direction.
- India VIX increase alone cannot set bullish/bearish direction.
- ADX increase alone cannot set bullish/bearish direction.
- IV increase alone cannot set bullish/bearish direction.
- OI level alone cannot infer participant side.

### Dependency / independence

- EMA9+20+50+200 agreement does not count as four independent families.
- MACD plus EMA agreement cannot multiply independent support without graph justification.
- OBV/CMF/MFI/RVOL dependency is represented.
- 100 duplicated low-authority evidence nodes cannot overpower one D1 safety blocker.

### Structure / PIT

- future-confirmed pivot cannot appear before confirmation time.
- HTF unfinished bar cannot be treated as closed state.
- PDH/PDL use only prior completed exchange session.
- event availability time is respected.

### SMC epistemics

- chart order block is labeled proxy/inference.
- FVG does not imply guaranteed fill.
- sweep requires defined level excursion and acceptance/re-entry logic.

### Derivatives

- OI build-up classification needs price and OI deltas.
- PCR type is explicit.
- signed dealer GEX is unavailable without sign evidence.
- IV rank is unavailable with insufficient history.
- expiry/rollover identity cannot mix contracts.

### Memory

- delayed labels are not available before label time.
- correlated episodes cannot inflate independent evidence count.
- missing masks remain part of similarity identity.
- mock 9C remains unreachable from canonical M4.

### Kronos

- mock/fallback Kronos has zero canonical influence.
- OOD/unverified model output cannot promote a candidate.
- model version/input hash are in receipt.

### Hypothesis

- no fabricated S/R or trade boundary when unavailable.
- every trade-like thesis has anti-thesis.
- unknown required evidence remains explicit.
- fake probability labels are rejected unless calibration contract exists.

### D6

- final authority remains singular.
- reviewers/specialists cannot upgrade final band directly.
- hard safety block dominates unlimited supporting evidence.
- unresolved material conflict caps promotion.
- fragile/single-factor thesis cannot become PAPER-CANDIDATE.
- no execution or order-routing authority is introduced.

## 31.27 Reconciliation with the existing agreed planning order

The previously saved planning priority remains valid:

```text
Hypothesis Box
-> Twin
-> ORB / AFRE
-> Kronos
-> Indicators / M3.1
-> 9-Candle Real Memory / M3.3
-> History + Pattern Diary / M3.3
-> Old Fake Album remains outside production
```

This research upgrade adds an important implementation dependency rule:

```text
Planning order != unsafe implementation shortcut.
```

For example, Hypothesis Box v2 can be designed first, but it must define the evidence contract it requires. Production promotion must not invent those facts while waiting for later Indicator/Fact-Kernel work. Missing required evidence stays missing and may cap the hypothesis.

Likewise, Twin can be improved second, but canonical conflict/independence semantics must not depend on Twin alone.

ORB/AFRE remain proposal specialists. Kronos remains bounded sequence evidence. Indicator/M3.1 and memory/M3.3 improvements then strengthen the same contracts without changing authority.

