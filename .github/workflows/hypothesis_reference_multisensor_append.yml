# 19. Running update log — multi-sensor redesign

## 2026-09-10 — Broader reasoning direction accepted

Accepted design changes from discussion:

- the newer multi-sensor plan is preferred over the earlier narrow examples;
- EMA/VWAP/OI are examples, not mandatory universal predictors;
- include chart order blocks and keep them distinct from real order flow;
- include three upper/three lower VWAP-band structure;
- evaluate a richer three-level Bollinger-band structure;
- include many indicator/calculation families instead of a small fixed set;
- dynamically route evidence by the current market question;
- reason over relationships and dependencies rather than indicator voting;
- generate multiple possible worlds and anti-theses;
- prediction means expected-path and failure-path reasoning, not certainty;
- evidence importance must be earned with PIT-safe real NSE validation and OOS testing;
- preserve D6 as sole final authority and all existing safety constraints.

This section is the preferred direction for the dedicated Hypothesis Box plan unless a later dated research/audit update explicitly replaces part of it.
