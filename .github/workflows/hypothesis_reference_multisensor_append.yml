# 18. Preferred multi-sensor Hypothesis Box design — 2026-09-10

This section records the improved direction from the 2026-09-10 design discussion. It supersedes any earlier impression that the Hypothesis Box should mainly reason from EMA, VWAP and OI. Those were only examples of evidence families, not the complete design.

## Core correction

The Hypothesis Box must not become a normal rule engine such as:

```text
EMA bullish
VWAP bullish
OI bullish
=> LONG
```

The target is a bounded, deterministic, auditable market-reasoning engine that can understand many kinds of evidence, decide which evidence matters for the current question, create several competing explanations, attack its own preferred explanation, and pass structured hypotheses forward without owning final authority.

The design goal is AGI-like breadth of reasoning inside strict safety, provenance, PIT and authority boundaries. It must not pretend to be a general AGI and must not use opaque free-form model output as final authority.

## Broad evidence world

The Hypothesis Box should be able to consume the following evidence families when they are canonically available and relevant.

### 1. Price structure and location

- support and resistance;
- swing highs and swing lows;
- HH / HL / LH / LL structure;
- BOS / CHOCH;
- previous-day high / low / close;
- CPR;
- floor pivots and other approved pivots;
- Fibonacci levels when valid;
- opening range / ORH / ORL;
- gap location and gap size;
- higher-timeframe levels.

### 2. Liquidity and smart-money-style structure

- chart-derived order blocks / supply-demand zones;
- FVGs / imbalances;
- liquidity sweeps;
- stop-run / SFP-style evidence;
- repeated level tests;
- acceptance / rejection around a zone;
- mitigation / retest behavior;
- proximity to likely liquidity pools.

Important distinction: a chart-derived order block is an inferred price zone. It must not be presented as proof that an institution actually placed orders there. Real order-book/order-flow evidence is a separate evidence type.

### 3. Value and auction evidence

- session VWAP;
- anchored VWAP when the anchor is valid and explicit;
- daily and weekly VWAP;
- VWAP upper/lower band 1;
- VWAP upper/lower band 2;
- VWAP upper/lower band 3;
- VWAP slope;
- distance from VWAP;
- VWAP reclaim / rejection / acceptance;
- band riding / extension behavior;
- POC / VAH / VAL;
- volume-profile structure when available.

The repository already contains daily/weekly VWAP band logic with three upper and three lower bands. These bands should be interpreted as one richer value/distribution structure, not seven independent votes.

### 4. Volatility and distribution evidence

- ATR;
- Bollinger middle line;
- Bollinger upper/lower 1-sigma state when implemented and validated;
- Bollinger upper/lower 2-sigma state;
- Bollinger upper/lower 3-sigma state;
- band width;
- band slope;
- compression;
- expansion;
- band walk;
- rejection from a band;
- acceptance outside a band;
- distance from the middle;
- Keltner Channel;
- BB/KC squeeze relationships;
- realized-volatility state;
- India VIX context.

The current ordinary Bollinger wrapper should not limit the future Hypothesis design. A richer 1/2/3-band representation may be added and must be empirically validated before decision influence.

### 5. Trend and horizon evidence

- EMA 9;
- EMA 20/21;
- EMA 50;
- EMA 200 when available;
- each EMA slope;
- separation / compression between averages;
- ordering of the averages;
- price location relative to each horizon;
- true higher-timeframe trend state;
- Supertrend;
- Ichimoku;
- ADX as trend-strength context;
- other validated M3.1 trend evidence.

EMA9, EMA20/21 and EMA50 must remain separate horizon facts but must not be counted as independent proof simply because there are three lines derived from the same price series.

### 6. Momentum evidence

- RSI level;
- RSI slope;
- RSI divergence;
- MACD state;
- MACD histogram/transition;
- stochastic state;
- momentum acceleration/deceleration;
- exhaustion evidence;
- approved oscillators from M3.1.

The same oscillator value can mean different things at different locations. Example: RSI 75 during a clean breakout may mean strong momentum; RSI 75 at weekly resistance with a liquidity sweep and weakening participation may support an exhaustion hypothesis.

### 7. Participation and flow evidence

- raw volume;
- relative volume / RVOL;
- volume expansion/contraction;
- OBV;
- CMF;
- MFI;
- breakout participation;
- available real order-book or order-flow imbalance;
- available trade-flow/delta evidence with known provenance.

Real order flow and chart-derived order blocks must remain separate facts.

### 8. Derivatives evidence

- futures price and change in open interest;
- options OI by strike and side;
- change in OI;
- put/call ratios;
- option/futures volume;
- IV;
- IV rank;
- term structure;
- skew;
- max pain proximity;
- GEX/gamma only under valid sign assumptions;
- vanna/charm where valid;
- basis;
- rollover;
- expiry state;
- participant/FII positioning when PIT-safe and available.

Raw OI alone must never be translated directly into bullish or bearish direction. Interpretation depends on price, OI change, instrument, strike, expiry, option type, IV, volume and surrounding structure.

### 9. Market context

- Nifty / benchmark direction;
- sector direction;
- relative strength;
- breadth;
- volatility regime;
- market phase;
- opening behavior;
- event/news calendar state from approved PIT-safe sources;
- expiry/session context.

### 10. Pattern and sequence evidence

- candlestick patterns;
- multi-candle transitions;
- inside/outside structures;
- breakout/retest sequences;
- rejection sequences;
- harmonic geometry plus validation;
- Elliott/wave hypotheses only when supported and explicitly uncertain;
- opening sequence;
- previous 1/3/5/9-bar behavior;
- level-interaction sequence;
- volume sequence.

A single candle pattern must not become a standalone vote. Location, sequence, volume, structure and context determine meaning.

### 11. Memory evidence

- real canonical 9-candle memory;
- historical analogs;
- pattern diary;
- transition-memory examples;
- previous failure trajectories;
- stock/timeframe/regime-conditioned reliability;
- OOD/drift indicators;
- sample-size and independence information.

Memory must answer more than "how many similar cases went up". It should show how comparable cases evolved, how failures developed, which warning signs existed, and whether the current state matches those warnings.

### 12. Specialist and reviewer evidence

- ORB proposals;
- AFRE scenarios;
- Twin disagreement/compatibility notes;
- real validated Kronos sequence evidence;
- other future bounded specialists that obey the authority registry.

Mock/synthetic reviewer outputs must not affect canonical decisions.

## Dynamic evidence selection instead of using everything equally

Knowing many indicators does not mean deeply processing every output every time.

The Hypothesis Box should first identify the active market question, then route the relevant evidence families.

Example: price is testing a major resistance zone.

Relevant evidence may include:

```text
LOCATION
- resistance
- HTF level
- order block / supply zone
- VWAP bands
- BB bands
- POC / VAH

BREAKOUT QUALITY
- close/acceptance
- volume / RVOL
- retest behavior
- BOS
- candle sequence

TREND
- EMA horizon states
- higher-timeframe trend
- ADX / Supertrend / Ichimoku where relevant

CONTEXT
- Nifty
- sector
- breadth

DERIVATIVES
- strike OI
- OI change
- IV / skew
- expiry state

MEMORY
- previous real breakouts
- previous false breakouts
- failure trajectories

SEQUENCE REVIEW
- validated Kronos evidence when available
```

An unrelated indicator should remain available but should not be promoted simply because it exists.

## Multiple possible worlds, not majority voting

Given a complex state, the box should build several competing hypotheses such as:

1. real breakout / continuation;
2. resistance rejection;
3. liquidity sweep followed by reversal;
4. compression below resistance followed by delayed expansion;
5. range continuation / mean reversion;
6. trend pullback rather than reversal;
7. event-distorted / untrustworthy state;
8. chop / no edge.

For every hypothesis it should record:

- thesis;
- anti-thesis;
- required facts;
- supporting evidence;
- opposing evidence;
- unknown/missing evidence;
- evidence dependencies and duplication;
- market phase;
- timeframe/horizon;
- expected next sequence;
- expected failure sequence;
- invalidators;
- expiry;
- regime assumptions;
- robustness/fragility;
- closest alternative hypotheses.

It must not decide by `6 bullish indicators versus 4 bearish indicators`.

## Dependency-aware reasoning

Many indicators are transformations of the same underlying data. The box must know this.

Examples:

- EMA9/20/50 are different horizon measurements but share price dependency;
- Bollinger bands and ATR both depend strongly on price/volatility information;
- RSI and MACD are both price-derived momentum/trend transformations;
- several volume indicators share volume input;
- multiple memories from highly correlated episodes are not independent evidence.

Therefore ten correlated signals must not create the confidence of ten independent observations.

## Relationship reasoning

The important information is often the relationship between sensors, not a single number.

Examples:

```text
price at weekly resistance
+ chart order block
+ VWAP upper band 3
+ BB upper band 2/3
+ weakening RVOL
+ bearish momentum divergence
```

may create an exhaustion/rejection hypothesis.

Whereas:

```text
same resistance
+ close accepted above it
+ strong RVOL
+ VWAP rising
+ BB expanding with a controlled band walk
+ retest holding old resistance as support
+ index/sector aligned
```

may create breakout-continuation evidence.

Neither relationship is a guaranteed prediction. It is a structured hypothesis that must be validated, challenged and monitored.

## Prediction should mean path reasoning

The Hypothesis Box does not know the future. It predicts by describing what should happen next if a proposed explanation is correct.

Example real-breakout path:

```text
break resistance
-> close/accept above
-> healthy participation
-> retest
-> old resistance holds as support
-> higher low
-> continuation
```

Example false-breakout path:

```text
trade above resistance
-> no acceptance
-> participation weakens
-> re-enter old range
-> lose value/VWAP area
-> structure weakens
-> downside expansion
```

As new closed-bar evidence arrives, the box should update which hypothesis is still plausible, fragile or invalid.

## Evidence must earn importance

No indicator family should be declared mandatory because it is popular or because it appears in an example.

Preferred promotion path:

```text
candidate evidence
    -> understand what it measures
    -> verify implementation and formula
    -> verify PIT/freshness/provenance
    -> test on real NSE data
    -> test by stock/timeframe/market phase/regime
    -> measure false-positive/failure behavior
    -> test dependencies with other evidence
    -> walk-forward / out-of-sample validation
    -> shadow/paper evaluation
    -> only then assign a canonical role
```

A sensor can be REQUIRED for one hypothesis, SUPPORTING for another, OPPOSING for another, IRRELEVANT in another state, or UNKNOWN when unavailable.

## Examples of conditional meaning

### VWAP

VWAP should be treated primarily as a value/location/acceptance sensor. `Price above VWAP` must not automatically equal bullish. Reclaim, rejection, slope, distance, band position, market phase and surrounding structure matter.

### EMA

EMA should be treated as a horizon/trend-state sensor. A crossover is not automatically a prediction. The box should understand slope, stack, separation, compression and higher-timeframe conflict.

### OI

OI should be treated as derivatives participation/positioning evidence. Raw OI alone has no directional meaning. Price/OI change, strike, expiry, option type, IV, volume and context must be considered.

### Order blocks

Chart order blocks are inferred structural zones. Their value depends on how price approaches, reacts, mitigates or accepts through them, plus volume/flow/context. They are not proof of institutional activity.

### Three-band VWAP

The center VWAP plus U1/U2/U3 and L1/L2/L3 should be treated as one value/distribution map. Useful derived facts include band location, slope, band ride, extension, reclaim, rejection and return-to-value behavior.

### Multi-band Bollinger structure

A richer BB representation can include center, +/-1 sigma, +/-2 sigma and +/-3 sigma together with width, slope, compression, expansion, band walk, rejection and acceptance. Reaching an upper band must not automatically mean overbought/sell; context determines whether it is momentum expansion or exhaustion.

## Example of the desired depth

Suppose price is near Rs 1,000.

Canonical evidence says:

```text
weekly resistance = 1,002
chart-derived order-block zone = 995-1,003
VWAP upper band 2 = 998
VWAP upper band 3 = 1,004
BB upper band 2 is being tested
BB width is expanding
EMA9 > EMA20 > EMA50
1h structure remains bearish
RVOL is high
call OI is concentrated near 1,000
sector is weaker than Nifty
memory contains similar failed breakouts
```

The box should NOT add bullish and bearish votes.

It should construct competing explanations such as:

```text
H1 REAL BREAKOUT
H2 RESISTANCE REJECTION
H3 LIQUIDITY SWEEP / FALSE BREAKOUT
H4 COMPRESSION THEN LATER EXPANSION
H5 NO CLEAR EDGE BECAUSE CONFLICT IS TOO HIGH
```

Then it asks for each hypothesis:

```text
What supports it?
What attacks it?
What evidence is duplicated?
What evidence is truly independent?
What is missing?
What should happen next if it is correct?
What should happen next if it is wrong?
What immediately invalidates it?
What did comparable historical cases do?
Does it survive if the strongest supporting clue is removed?
Does an alternative explanation fit the same facts better?
```

That is the preferred Hypothesis Box reasoning model.

## Strong design formula

```text
KNOW MANY MARKET FACTS
        +
UNDERSTAND WHAT EACH FACT ACTUALLY MEASURES
        +
UNDERSTAND LOCATION AND MARKET PHASE
        +
UNDERSTAND RELATIONSHIPS AND DEPENDENCIES
        +
USE MULTIPLE TIMEFRAMES CORRECTLY
        +
CREATE MULTIPLE POSSIBLE FUTURE PATHS
        +
BUILD A STRONG ANTI-THESIS
        +
TRY TO DISPROVE THE PREFERRED THESIS
        +
COMPARE WITH PIT-SAFE REAL MEMORY
        +
USE CONDITIONAL EMPIRICAL RELIABILITY
        +
PRESERVE MISSING / UNKNOWN / CONFLICT
        =
STRONG BOUNDED HYPOTHESIS REASONING
```

## Authority and safety remain unchanged

Even after this intelligence expansion:

- Hypothesis Box has no execution authority;
- Hypothesis Box cannot route orders;
- Hypothesis Box cannot produce the final trade band;
- D6 remains sole final-band authority;
- mock/synthetic evidence cannot influence production decisions;
- future data cannot be used as causal evidence;
- unavailable data remains unavailable;
- no fake probability is allowed;
- no silent neutralization of missing evidence is allowed.

## Repository observations motivating this expansion

The current project already contains or references more than the narrow EMA/VWAP/OI examples, including:

- market-structure overlay output with dynamic VWAP, pivots, zones, FVGs, trendlines, heatmap and HTF context;
- an order-block zone builder inside the preserved indicator implementation;
- daily and weekly VWAP with three upper and three lower running-deviation bands;
- Bollinger-band logic;
- CPR/pivots;
- multiple trend, momentum, volume and structure families in the 94-output registry.

Therefore Hypothesis Engine v2 should be designed to reason over the broader canonical evidence graph rather than throwing away already-available information.

