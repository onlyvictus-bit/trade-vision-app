name: M0 Stage2 Committed Verify

on:
  workflow_dispatch:
  push:
    branches:
      - decision-spine-orchestration-v1
    paths:
      - .github/workflows/m0-stage2-committed-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout committed feature branch
        uses: actions/checkout@v4
        with:
          ref: decision-spine-orchestration-v1
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt

      - name: Compile M0 modules
        run: |
          python -m py_compile \
            apps/api/app/models.py \
            apps/api/app/behavior/nine_candle_hybrid.py \
            apps/api/app/behavior/indicator_runtime_bridge.py \
            apps/api/app/behavior/paper_guidance_spine.py \
            apps/api/app/behavior/decision_spine/authority_registry.py \
            apps/api/app/behavior/decision_spine/stage2_integrity.py

      - name: Stage2 integrity suite
        working-directory: apps/api
        run: pytest -q tests/decision_spine/test_stage2_integrity.py

      - name: Paper Guidance Stage2 suite
        working-directory: apps/api
        run: pytest -q tests/test_paper_guidance_v188.py

      - name: Full API regression file
        working-directory: apps/api
        run: pytest -q tests/test_api.py

      - name: Verify immutable safety authority rules
        working-directory: apps/api
        run: |
          python - <<'PY'
          from app.behavior.decision_spine.authority_registry import FINAL_BAND_AUTHORITY, all_engine_authorities, validate_authority_registry
          assert validate_authority_registry() == ()
          assert [e.engine_id for e in all_engine_authorities() if e.may_set_final_band] == [FINAL_BAND_AUTHORITY]
          assert all(not e.may_execute for e in all_engine_authorities())
          print('M0 authority invariants verified')
          PY
