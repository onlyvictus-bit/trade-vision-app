name: AFRE v4 CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/afre-v4-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  afre-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install --upgrade pip && pip install -r apps/api/requirements.txt
      - name: Compile adaptive engine
        working-directory: apps/api
        run: python -m compileall -q app/orb/adaptive
      - name: Run AFRE regression suite
        working-directory: apps/api
        run: pytest tests/afre -q

  api-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install --upgrade pip && pip install -r apps/api/requirements.txt
      - name: Run complete API test suite on PR
        working-directory: apps/api
        run: pytest tests -q

  main-baseline-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install --upgrade pip && pip install -r apps/api/requirements.txt
      - name: Run identical complete API suite on main baseline
        working-directory: apps/api
        run: pytest tests -q
