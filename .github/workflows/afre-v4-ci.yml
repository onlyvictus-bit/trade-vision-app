name: AFRE v4 CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/afre-v4-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  afre-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install --upgrade pip && pip install -r apps/api/requirements.txt
      - name: Compile adaptive engine
        working-directory: apps/api
        run: python -m compileall -q app/orb/adaptive
      - name: Run AFRE regression suite
        working-directory: apps/api
        run: pytest tests/afre -q

  api-no-new-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install --upgrade pip && pip install -r apps/api/requirements.txt
      - name: Run full API suite excluding only failures reproduced on main
        working-directory: apps/api
        run: >-
          pytest tests -q
          --deselect=tests/test_api.py::test_9c_033_real_indicator_payload_is_normalized_without_changing_default
          --deselect=tests/test_api.py::test_9c_runtime_008_real_runtime_probes_pta_markers_without_probability_or_trading
          --deselect=tests/test_api.py::test_9c_runtime_009_fmfm300_is_explanation_only_and_not_trade_authority
          --deselect=tests/test_orb_opening_scenarios_v201.py::test_tv_v201_006_real_data_partition_invariant_and_coverage
          --deselect=tests/test_research_stack_verifier.py::test_research_stack_wrapper_powershell_parser_has_no_errors

  api-full-regression-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install --upgrade pip && pip install -r apps/api/requirements.txt
      - name: Run complete API test suite on PR for visibility
        working-directory: apps/api
        run: pytest tests -q

  main-baseline-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install --upgrade pip && pip install -r apps/api/requirements.txt
      - name: Run identical complete API suite on main baseline
        working-directory: apps/api
        run: pytest tests -q
