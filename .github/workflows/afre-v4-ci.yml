name: AFRE v4 CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/afre-v4-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  afre-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install --upgrade pip && pip install -r apps/api/requirements.txt
      - name: Compile adaptive engine
        working-directory: apps/api
        run: python -m compileall -q app/orb/adaptive
      - name: Run AFRE regression suite
        working-directory: apps/api
        run: pytest tests/afre -q

  api-no-new-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR candidate
        uses: actions/checkout@v4
        with:
          path: pr

      - name: Checkout base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: baseline

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pr/apps/api/requirements.txt
            baseline/apps/api/requirements.txt

      - name: Create isolated test environments
        shell: bash
        run: |
          python -m venv .venv-pr
          python -m venv .venv-baseline
          .venv-pr/bin/python -m pip install --upgrade pip
          .venv-baseline/bin/python -m pip install --upgrade pip
          .venv-pr/bin/python -m pip install -r pr/apps/api/requirements.txt
          .venv-baseline/bin/python -m pip install -r baseline/apps/api/requirements.txt

      - name: Run complete API suite on base revision
        id: baseline_suite
        working-directory: baseline/apps/api
        shell: bash
        run: |
          set +e
          "${{ github.workspace }}/.venv-baseline/bin/python" -m pytest tests -q --junitxml="${{ github.workspace }}/baseline-results.xml"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run complete API suite on PR candidate
        id: pr_suite
        working-directory: pr/apps/api
        shell: bash
        run: |
          set +e
          "${{ github.workspace }}/.venv-pr/bin/python" -m pytest tests -q --junitxml="${{ github.workspace }}/pr-results.xml"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Fail only on regressions introduced by PR
        env:
          BASELINE_XML: ${{ github.workspace }}/baseline-results.xml
          PR_XML: ${{ github.workspace }}/pr-results.xml
          BASELINE_EXIT: ${{ steps.baseline_suite.outputs.exit_code }}
          PR_EXIT: ${{ steps.pr_suite.outputs.exit_code }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          def failed_cases(path: str) -> set[str]:
              root = ET.parse(path).getroot()
              failures: set[str] = set()
              for case in root.iter("testcase"):
                  if case.find("failure") is None and case.find("error") is None:
                      continue
                  location = case.attrib.get("file") or case.attrib.get("classname") or "unknown"
                  name = case.attrib.get("name") or "unknown"
                  failures.add(f"{location}::{name}")
              return failures

          baseline_exit = int(os.environ["BASELINE_EXIT"])
          pr_exit = int(os.environ["PR_EXIT"])
          if baseline_exit not in (0, 1):
              raise SystemExit(f"Base suite did not complete normally (pytest exit {baseline_exit}); cannot establish regression baseline")
          if pr_exit not in (0, 1):
              raise SystemExit(f"PR suite did not complete normally (pytest exit {pr_exit})")

          baseline_failures = failed_cases(os.environ["BASELINE_XML"])
          pr_failures = failed_cases(os.environ["PR_XML"])
          new_failures = sorted(pr_failures - baseline_failures)
          resolved_failures = sorted(baseline_failures - pr_failures)

          print(f"Base failures: {len(baseline_failures)}")
          for item in sorted(baseline_failures):
              print(f"  BASE_FAIL {item}")
          print(f"PR failures: {len(pr_failures)}")
          for item in sorted(pr_failures):
              print(f"  PR_FAIL   {item}")
          if resolved_failures:
              print("Failures resolved by PR:")
              for item in resolved_failures:
                  print(f"  RESOLVED  {item}")
          if new_failures:
              print("New regressions introduced by PR:")
              for item in new_failures:
                  print(f"  NEW_FAIL  {item}")
              sys.exit(1)

          print("PASS: PR introduces zero new pytest failures relative to its base revision.")
          PY
