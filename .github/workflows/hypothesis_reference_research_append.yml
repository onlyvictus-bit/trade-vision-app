# 18. Evidence review correction — VWAP, EMA and Open Interest

## 2026-09-10 — Research check after design challenge

Important correction: VWAP, EMA and OI must not be treated as automatically necessary or proven predictors merely because they are common trading tools.

The earlier examples used them as plausible evidence types based on the existing Trade Vision architecture and standard market reasoning. That was not, by itself, enough to lock the design. A targeted evidence review was then performed.

### VWAP

Research literature strongly supports VWAP as a volume-weighted market benchmark and execution reference. That does NOT prove that VWAP by itself predicts the next price move or is automatically support/resistance.

Design implication:

- use VWAP primarily as a value/location/acceptance reference;
- test whether price behavior around VWAP adds useful information for NSE intraday hypotheses;
- do not let `above VWAP` automatically mean bullish;
- do not require VWAP in every hypothesis.

### EMA / moving averages

Academic evidence on moving-average rules is mixed. Some studies find predictive usefulness in some markets and periods, including emerging/South-Asian markets, while other studies find that predictive power weakens or disappears over time.

Design implication:

- use EMA mainly as a typed trend/horizon state sensor;
- preserve fast/medium/slow horizon information;
- do not treat an EMA crossover as a guaranteed predictor;
- empirically validate each EMA relationship on PIT-clean NSE data by stock, timeframe, market phase and regime;
- do not count EMA9/20/50 as three independent proofs.

### Open Interest

NSE defines open interest as unsettled derivative contracts. Open interest contains information about derivatives participation/positioning, and research including NSE-based data has found informational content in OI/volume variables. However, OI alone does not reveal direction: every open contract has both a long and a short side.

Design implication:

- never use raw OI alone as `bullish` or `bearish`;
- interpret OI together with price change, change in OI, strike, expiry, option type, volume, IV and broader derivatives context;
- treat an apparent OI wall as a hypothesis/context feature that must be tested, not a guaranteed resistance/support wall;
- validate usefulness on NSE held-out data before promotion.

### Stronger design rule

The Hypothesis Box should not have a fixed list saying `VWAP + EMA + OI are required`.

Instead:

```text
candidate evidence
    -> known market meaning
    -> source/PIT/freshness proof
    -> empirical NSE validation
    -> context/regime usefulness
    -> dependency check
    -> then eligible for the relevant hypothesis
```

An evidence item may be:

- REQUIRED for one hypothesis;
- SUPPORTING for another;
- OPPOSING for another;
- IRRELEVANT in a different market state;
- UNKNOWN / UNAVAILABLE when data is missing.

### Sources checked

- Białkowski et al., "Improving VWAP strategies: A dynamic volume approach", Journal of Banking & Finance: VWAP as an execution benchmark and intraday volume problem.
- Zhu & Zhou, "Technical analysis: An asset allocation perspective on the use of moving averages", Journal of Financial Economics (2009): evidence that moving-average information can add value under some predictability assumptions.
- Urquhart et al., "How exactly do markets adapt? Evidence from the moving average rule in three developed markets" (2015): moving-average predictive power diminished in later samples.
- Gunasekarage & Power, "The profitability of moving average trading rules in South Asian stock markets" (2001): evidence of predictive ability in sampled South Asian markets.
- Hong & Yogo, "What does futures market interest tell us about the macroeconomy and asset prices?", Journal of Financial Economics (2012): open interest can contain information beyond futures prices.
- IIMB Management Review (2020), "Testing the informativeness of non-price variables with MIDAS touch": NSE/CMIE data found OI and volume-based variables informative for underlying price forecasting for sampled stocks/Nifty.
- NSE definitions: open interest is the number of derivative contracts remaining unsettled.

### Conclusion

VWAP, EMA and OI are reasonable candidate evidence families, not automatically necessary predictors. Their exact role in Trade Vision should be earned through canonical data quality, PIT safety, empirical NSE validation, context-specific usefulness and out-of-sample testing.
'''
              p.write_text(text, encoding='utf-8')
          PY
